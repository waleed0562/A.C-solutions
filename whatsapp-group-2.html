<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Our WhatsApp Group</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { --green: #25D366; --dark: #075E54; --ink: #16213e; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #e8fff2 0%, #ffffff 55%, #dff9ea 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(7, 94, 84, 0.16);
    }
    .icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--green);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 44px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 42px); }
    p { margin: 0 auto 26px; max-width: 440px; line-height: 1.7; color: #52606d; }
    .join-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(360px, 100%);
      min-height: 58px;
      border-radius: 999px;
      background: var(--green);
      color: #083d27;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.28);
      transition: transform .15s ease, background .15s ease;
    }
    .join-button:hover { background: #20c95a; transform: translateY(-2px); }
    .join-button:focus-visible { outline: 4px solid rgba(7, 94, 84, .25); outline-offset: 4px; }
    .note { display: block; margin-top: 16px; font-size: 13px; color: #7a8793; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">☎</div>
    <h1>Join Our WhatsApp Group</h1>
    <p>Tap the button below to open WhatsApp and request to join our group. You stay in control of when you join.</p>
    <a class="join-button" href="https://chat.whatsapp.com/KYKO5lSbyZf2gHgc6lAiJP?s=cl&p=a&iam=2" rel="nofollow noopener" target="_blank">
      Join on WhatsApp
    </a>
    <span class="note">WhatsApp will open in a new tab</span>
  </main>
</body>
</html>
